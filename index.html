HTML

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152f">
<title>NEDOVA | ندوا</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Tahoma,Arial,sans-serif;
background:#0b1024;
color:#fff;
min-height:100vh;
}
header{
background:#151d3b;
padding:20px;
text-align:center;
border-bottom:1px solid #303d70;
}
.logo{
font-size:34px;
font-weight:bold;
letter-spacing:3px;
background:linear-gradient(90deg,#56c8ff,#a78bfa);
-webkit-background-clip:text;
color:transparent;
}
header p{color:#b8c5e8;margin-top:8px}
.container{
width:90%;
max-width:520px;
margin:45px auto;
}
.card{
background:#151d3b;
padding:28px;
border-radius:20px;
border:1px solid #303d70;
box-shadow:0 12px 35px #0005;
}
h2{text-align:center;margin-bottom:12px}
.description{
text-align:center;
color:#aebbdc;
line-height:2;
margin-bottom:24px;
}
input{
width:100%;
padding:15px;
margin:9px 0;
border:1px solid #394775;
border-radius:10px;
background:#0b1024;
color:white;
font-size:15px;
outline:none;
}
input:focus{border-color:#65bfff}
button{
width:100%;
padding:15px;
margin-top:14px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#287eea,#8056d9);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
button:hover{opacity:.9}
.switch{
text-align:center;
margin-top:22px;
color:#aebbdc;
font-size:14px;
}
.switch span{
color:#67c5ff;
cursor:pointer;
font-weight:bold;
}
#message{
text-align:center;
margin-top:18px;
color:#7ee6bd;
line-height:2;
}
footer{
text-align:center;
color:#7381a8;
padding:25px;
font-size:12px;
}
.hidden{display:none}
</style>
</head>
<body>

<header>
<div class="logo">NEDOVA</div>
<p>دنیایی تازه برای ارتباطات جهانی</p>
</header>

<main class="container">

<section class="card" id="login">
<h2>به ندوا خوش آمدید</h2>
<p class="description">
ارتباطی نو، جهانی بزرگ‌تر و تجربه‌ای متفاوت
</p>

<form id="loginForm">
<input type="email" id="loginEmail"
placeholder="ایمیل شما" required>
<input type="password" id="loginPassword"
placeholder="رمز عبور" required>
<button type="submit">ورود به ندوا</button>
</form>

<div class="switch">
حساب کاربری ندارید؟
<span onclick="showRegister()">ثبت‌نام کنید</span>
</div>
</section>

<section class="card hidden" id="register">
<h2>ساخت حساب کاربری</h2>
<p class="description">
به خانواده جهانی ندوا بپیوندید
</p>

<form id="registerForm">
<input type="text" id="name"
placeholder="نام شما" required>
<input type="email" id="email"
placeholder="ایمیل شما" required>
<input type="password" id="password"
placeholder="رمز عبور" minlength="6" required>
<button type="submit">ایجاد حساب</button>
</form>

<div class="switch">
حساب دارید؟
<span onclick="showLogin()">وارد شوید</span>
</div>
</section>

<section class="card hidden" id="welcome">
<h2>به ندوا خوش آمدی!</h2>
<p class="description" id="welcomeText"></p>
<button onclick="logout()">خروج از حساب</button>
</section>

<p id="message"></p>

</main>

<footer>
© 2026 NEDOVA - All Rights Reserved
</footer>

<script>
const login=document.getElementById("login");
const register=document.getElementById("register");
const welcome=document.getElementById("welcome");
const message=document.getElementById("message");

function showRegister(){
login.classList.add("hidden");
register.classList.remove("hidden");
message.textContent="";
}

function showLogin(){
register.classList.add("hidden");
login.classList.remove("hidden");
message.textContent="";
}

function logout(){
welcome.classList.add("hidden");
login.classList.remove("hidden");
message.textContent="با آرزوی دیدار دوباره!";
}

document.getElementById("registerForm")
.addEventListener("submit",function(e){
e.preventDefault();

const name=document.getElementById("name").value;
const email=document.getElementById("email").value;

message.textContent=
"سلام "+name+"! فرم شما آماده است. برای ثبت واقعی حساب، به سرور نیاز داریم.";

});

document.getElementById("loginForm")
.addEventListener("submit",function(e){
e.preventDefault();
message.textContent=
"ورود نمایشی است؛ برای ورود واقعی باید سیستم احراز هویت متصل شود.";
});
</script>

</body>
</html>
