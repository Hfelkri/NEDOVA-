
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10152f">
  <title>NEDOVA | ندوا</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0b1024, #17234a);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.3);
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #70d6ff;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #b8c7e8;
      font-size: 14px;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 14px;
    }

    .description {
      color: #c5d0e8;
      font-size: 13px;
      line-height: 2;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 9px 0;
      border: 1px solid #52658f;
      border-radius: 12px;
      background: #111b38;
      color: white;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #70d6ff;
    }

    input::placeholder {
      color: #9baac8;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #168aad, #4361ee);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary {
      background: #26365f;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 18px;
      color: #ffe08a;
      font-size: 13px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    #recaptcha-container {
      display: flex;
      justify-content: center;
      margin: 16px 0;
      min-height: 10px;
    }

    .footer {
      color: #8191b5;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">NEDOVA</div>
    <div class="subtitle">پیام‌رسان ندوا | ارتباطی ساده و امن</div>

    <section id="login">

      <h2>ورود به ندوا</h2>

      <p class="description">
        برای ورود، شماره موبایل خود را همراه با کد کشور وارد کنید.
      </p>

      <input
        type="tel"
        id="phone-number"
        placeholder="مثلاً 09121234567"
        autocomplete="tel"
      >

      <div id="recaptcha-container"></div>

      <button id="send-code">
        ارسال کد تأیید
      </button>

      <div id="code-section" class="hidden">

        <p class="description">
          کد پیامک‌شده را در کادر زیر وارد کنید.
        </p>

        <input
          type="text"
          id="verification-code"
          placeholder="کد تأیید پیامکی"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
        >

        <button id="verify-code">
          تأیید کد و ورود
        </button>

        <button id="change-number" class="secondary">
          تغییر شماره موبایل
        </button>

      </div>

    </section>

    <section id="welcome" class="hidden">

      <h2>سلام، خوش آمدید 🌷</h2>

      <p class="description">
        ورود شما به پیام‌رسان ندوا با موفقیت انجام شد.
      </p>

      <p id="user-phone" class="description"></p>

      <button id="logout" class="secondary">
        خروج از حساب
      </button>

    </section>

    <p id="message" aria-live="polite"></p>

    <div class="footer">
      NEDOVA © تمامی حقوق محفوظ است
    </div>

  </main>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";


    // تنظیمات پروژه Firebase ندوا

    const firebaseConfig = {
      apiKey: "AIzaSyCKweF0EkozTKMlQ70BOLDM-T-Lco6vQyA",
      authDomain: "nedova-b3ae3.firebaseapp.com",
      projectId: "nedova-b3ae3",
      storageBucket: "nedova-b3ae3.firebasestorage.app",
      messagingSenderId: "549277405776",
      appId: "1:549277405776:web:8658c99376867fe46b7755"
    };


    // راه‌اندازی Firebase

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    auth.languageCode = "fa";


    // دریافت عناصر صفحه

    const loginSection = document.getElementById("login");
    const welcomeSection = document.getElementById("welcome");

    const phoneInput = document.getElementById("phone-number");
    const codeInput = document.getElementById("verification-code");

    const sendButton = document.getElementById("send-code");
    const verifyButton = document.getElementById("verify-code");
    const changeNumberButton = document.getElementById("change-number");
    const logoutButton = document.getElementById("logout");

    const codeSection = document.getElementById("code-section");
    const message = document.getElementById("message");
    const userPhone = document.getElementById("user-phone");

    let recaptchaVerifier = null;
    let confirmationResult = null;


    // تبدیل اعداد فارسی و عربی به انگلیسی

    function englishDigits(value) {
      return value
        .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
        .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
    }


    // آماده‌سازی شماره موبایل ایران

    function preparePhoneNumber(value) {
      let phone = englishDigits(value).replace(/[\s\-()]/g, "");

      if (phone.startsWith("09") && phone.length === 11) {
        phone = "+98" + phone.substring(1);
      } else if (phone.startsWith("9") && phone.length === 10) {
        phone = "+98" + phone;
      } else if (phone.startsWith("0098")) {
        phone = "+98" + phone.substring(4);
      } else if (phone.startsWith("98")) {
        phone = "+" + phone;
      }

      return phone;
    }


    // نمایش پیام

    function showMessage(text) {
      message.textContent = text;
    }


    // ساخت reCAPTCHA

    function createRecaptcha() {
      if (!recaptchaVerifier) {
        recaptchaVerifier = new RecaptchaVerifier(
          auth,
          "recaptcha-container",
          {
            size: "normal"
          }
        );
      }

      return recaptchaVerifier;
    }


    // ارسال کد پیامکی

    sendButton.addEventListener("click", async () => {

      const phoneNumber = preparePhoneNumber(phoneInput.value);

      if (!/^\+[1-9]\d{7,14}$/.test(phoneNumber)) {
        showMessage("شماره موبایل معتبر نیست. شماره را با کد کشور وارد کنید.");
        return;
      }

      phoneInput.value = phoneNumber;
      sendButton.disabled = true;
      showMessage("در حال آماده‌سازی ارسال کد...");

      try {

        const verifier = createRecaptcha();

        confirmationResult = await signInWithPhoneNumber(
          auth,
          phoneNumber,
          verifier
        );

        codeSection.classList.remove("hidden");
        phoneInput.disabled = true;
        sendButton.classList.add("hidden");

        showMessage("کد تأیید ارسال شد. پیامک خود را بررسی کنید.");

      } catch (error) {

        console.error(error);

        showMessage("ارسال کد انجام نشد: " + error.message);

        if (recaptchaVerifier) {
          recaptchaVerifier.clear();
          recaptchaVerifier = null;
        }

      } finally {
        sendButton.disabled = false;
      }

    });


    // تأیید کد و ورود کاربر

    verifyButton.addEventListener("click", async () => {

      const code = englishDigits(codeInput.value.trim());

      if (!confirmationResult) {
        showMessage("ابتدا درخواست ارسال کد را انجام دهید.");
        return;
      }

      if (!/^\d{6}$/.test(code)) {
        showMessage("لطفاً کد شش رقمی پیامک‌شده را وارد کنید.");
        return;
      }

      verifyButton.disabled = true;
      showMessage("در حال بررسی کد...");

      try {

        await confirmationResult.confirm(code);

        showMessage("ورود موفقیت‌آمیز بود.");

      } catch (error) {

        console.error(error);

        showMessage("کد واردشده صحیح نیست یا اعتبار آن تمام شده است.");

      } finally {
        verifyButton.disabled = false;
      }

    });


    // تغییر شماره موبایل

    changeNumberButton.addEventListener("click", () => {

      confirmationResult = null;

      codeSection.classList.add("hidden");
      phoneInput.disabled = false;
      sendButton.classList.remove("hidden");

      codeInput.value = "";

      showMessage("شماره موبایل را اصلاح کنید.");

    });


    // خروج از حساب

    logoutButton.addEventListener("click", async () => {

      try {
        await signOut(auth);
        showMessage("از حساب خود خارج شدید.");
      } catch (error) {
        showMessage("خطا در خروج از حساب: " + error.message);
      }

    });


    // بررسی وضعیت ورود کاربر

    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginSection.classList.add("hidden");
        welcomeSection.classList.remove("hidden");

        userPhone.textContent =
          "شماره موبایل شما: " + (user.phoneNumber || "");

        showMessage("");

      } else {

        loginSection.classList.remove("hidden");
        welcomeSection.classList.add("hidden");

      }

    });

  </script>

</body>
</html>
